symptom: cough
canonical_names:
  - cough
  - dry cough
  - దగ్గు
  - పొడి దగ్గు
  - खांसी

questions:
  - field_name: duration_days
    section: hpi
    priority: 1
    required: true
    input_type: number
    min_val: 0
    max_val: 180
    question:
      en: "How many days have you had this cough?"
      te: "మీకు దగ్గు ఎన్ని రోజులుగా ఉంది?"
      hi: "आपको खांसी कितने दिनों से आ रही है?"

  - field_name: breathlessness
    section: hpi
    priority: 2
    required: true
    input_type: yes_no
    question:
      en: "Are you having difficulty in breathing?"
      te: "శ్వాస తీసుకోవడంలో ఏదైనా ఇబ్బంది ఉందా?"
      hi: "क्या आपको सांस लेने में कोई तकलीफ हो रही है?"
    options:
      - value: "true"
        label:
          en: "YES"
          te: "అవును (Yes)"
          hi: "हाँ (Yes)"
      - value: "false"
        label:
          en: "NO"
          te: "లేదు (No)"
          hi: "नहीं (No)"

  - field_name: fever
    section: hpi
    priority: 3
    required: true
    input_type: yes_no
    question:
      en: "Do you have fever accompanying the cough?"
      te: "దగ్గుతో పాటు జ్వరం ఉందా?"
      hi: "क्या खांसी के साथ बुखार भी है?"
    options:
      - value: "true"
        label:
          en: "YES"
          te: "అవును (Yes)"
          hi: "हाँ (Yes)"
      - value: "false"
        label:
          en: "NO"
          te: "లేదు (No)"
          hi: "नहीं (No)"
